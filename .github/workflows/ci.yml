name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check syntax
        run: python -m py_compile main.py && python -m compileall app/ -q
      - name: Install flake8
        run: pip install flake8
      - name: Lint
        run: flake8 app/ --max-line-length=150 --ignore=E501,W503,E402,W291,W292,W293,E303,E266,E265,W504,E711,E712,F401,E741 --count --show-source --statistics
